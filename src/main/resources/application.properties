# ===========================================================================
# MediTrack application configuration
# ===========================================================================
spring.application.name=MediTrack

# In-memory H2 database (resets on restart - fine for a demo/assessment build)
spring.datasource.url=jdbc:h2:mem:meditrack;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa

# NOTE: hardcoded credential left in config on purpose.
# SonarQube will raise this as a Security Hotspot (hardcoded password).
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
